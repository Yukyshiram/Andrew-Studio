name: Calidad · Demo y Laravel
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/interactive-demo, release/bibliotecary-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  demo:
    name: Demo estática · tres motores
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:domain
      - run: npm run build
      - run: npm run security:check
      - run: npm audit --audit-level=low
      - run: node demo/scripts/playwright.mjs install --with-deps chromium firefox webkit
      - run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: demo-estatica
          path: dist/
          retention-days: 7
  laravel:
    name: Laravel · seguridad y regresión
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: modern/package-lock.json
      - name: Instalación aislada de CI
        shell: pwsh
        run: ./modern/scripts/install.ps1 -Demo
      - name: Navegador y librerías del runner
        run: node modern/scripts/playwright.mjs install --with-deps chromium
      - name: PHP, PHPStan, TypeScript, build, auditorías y Playwright
        shell: pwsh
        run: ./modern/scripts/test.ps1
      - name: Detener servicios efímeros de CI
        if: always()
        working-directory: modern
        run: docker compose --profile qa down
