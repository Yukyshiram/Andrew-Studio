# El legado usa una identidad de host distinta para no compartir cookies/XSRF
# con la aplicación moderna. La redirección ocurre antes de ejecutar PHP.
<Directory /var/www/html>
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^localhost(:[0-9]+)?$ [NC]
    RewriteRule ^ http://127.0.0.1%1%{REQUEST_URI} [R=302,L]
    RewriteCond %{HTTP_HOST} !^127\.0\.0\.1(:[0-9]+)?$ [NC]
    RewriteRule ^ - [F]
</Directory>
